<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>browser-afk-game · audio demo</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1f1f1f;
        --fg: #ece9e2;
        --accent: #ff7a1a;
      }
      body {
        margin: 0 auto;
        max-width: 44rem;
        padding: 2rem 1rem;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 ui-monospace, Menlo, Consolas, monospace;
      }
      h1 {
        font-size: 1.2rem;
      }
      h2 {
        margin-top: 2rem;
        font-size: 1rem;
      }
      button {
        margin: 0.2rem 0.3rem 0.2rem 0;
        padding: 0.35rem 0.8rem;
        border: 1px solid var(--fg);
        background: none;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button:hover,
      button[aria-pressed='true'] {
        border-color: var(--accent);
        color: var(--accent);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #start {
        font-size: 1.1rem;
        padding: 0.5rem 1.5rem;
      }
      .track {
        margin: 0.8rem 0;
        padding: 0.6rem 0.8rem;
        border: 1px solid #444;
      }
      .track p {
        margin: 0.2rem 0 0.4rem;
        opacity: 0.75;
      }
      label {
        display: flex;
        gap: 0.8rem;
        align-items: center;
        margin: 0.4rem 0;
      }
      input[type='range'] {
        width: 14rem;
        accent-color: var(--accent);
      }
      #status {
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <h1>browser-afk-game · music &amp; SFX prototypes</h1>
    <p>
      Nothing plays until Start (same as the game). Listen to both loops for a while: they are
      background music for an idle game on a blog.
    </p>
    <button id="start">Start</button>
    <span id="status">not started</span>

    <h2>Music</h2>
    <div id="tracks"></div>

    <h2>Mix</h2>
    <label>music <input id="music" type="range" min="0" max="1" step="0.01" /> <span></span></label>
    <label>sfx <input id="sfx" type="range" min="0" max="1" step="0.01" /> <span></span></label>
    <label><input id="mute" type="checkbox" /> mute</label>
    <button id="pause">Pause</button>
    <button id="resume">Resume</button>

    <h2>SFX</h2>
    <div id="sfx-buttons"></div>
    <label><input id="combat" type="checkbox" /> simulate combat (swing / hit / coin over the music)</label>

    <script type="module" src="./audio.ts"></script>
  </body>
</html>
