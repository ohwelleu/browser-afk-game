<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>browser-afk-game demo</title>
    <script>
      // Apply the saved demo theme before first paint.
      document.documentElement.classList.toggle(
        'dark',
        (localStorage.getItem('afk-demo-theme') ??
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark',
      );
    </script>
    <script src="./afk-game.js" defer></script>
    <style>
      :root {
        --page-bg: #ece9e2;
        --page-fg: #1f1f1f;
        color-scheme: light;
      }
      :root.dark {
        --page-bg: #1f1f1f;
        --page-fg: #ece9e2;
        color-scheme: dark;
      }
      body {
        margin: 0 auto;
        max-width: 1200px;
        padding: 24px;
        background: var(--page-bg);
        color: var(--page-fg);
        font:
          15px/1.5 system-ui,
          sans-serif;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin: 16px 0;
      }
      button,
      select {
        font: inherit;
      }
      code {
        font-size: 0.9em;
      }
      .staging-changelog ul {
        padding-left: 1.2em;
      }
      .staging-changelog li {
        margin: 2px 0;
      }
      .staging-changelog a {
        color: inherit;
      }
      .staging-changelog .sc-date {
        opacity: 0.6;
        font-size: 0.85em;
        white-space: nowrap;
      }
      .staging-changelog small {
        opacity: 0.7;
      }
      .demo-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        margin: 0 0 12px;
        font:
          13px/1.4 ui-monospace,
          Menlo,
          Consolas,
          monospace;
      }
      .demo-nav a {
        color: inherit;
        opacity: 0.7;
        text-decoration: none;
      }
      .demo-nav a:hover {
        text-decoration: underline;
      }
      .demo-nav a[aria-current='page'] {
        font-weight: bold;
        opacity: 1;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <nav class="demo-nav" aria-label="Demo pages">
      <a href="./?afkdebug">Game</a> · <a href="./sprites.html">Sprites</a> ·
      <a href="./audio.html">Music &amp; SFX</a> · <a href="./examples.html">Examples</a>
    </nav>
    <script>
      for (const a of document.querySelectorAll('.demo-nav a')) {
        const page = (p) => p.replace(/index\.html$/, '');
        if (page(a.pathname) === page(location.pathname)) a.setAttribute('aria-current', 'page');
      }
    </script>
    <h1>browser-afk-game</h1>
    <p>Dev page. Version: <code id="version">?</code></p>

    <div class="controls">
      <button id="toggle-page-theme" type="button">Toggle page theme (html.dark)</button>
      <label>
        <code>theme</code> attribute:
        <select id="theme-attr">
          <option value="auto">auto</option>
          <option value="dark">dark</option>
          <option value="light">light</option>
        </select>
      </label>
      <label><input id="debug" type="checkbox" /> <code>debug</code></label>
      <button id="clear-save" type="button">Clear save</button>
    </div>

    <h2>Default</h2>
    <afk-game id="game"></afk-game>

    <!-- staging-changelog -->

    <script>
      const root = document.documentElement;
      const game = document.getElementById('game');

      document.getElementById('toggle-page-theme').addEventListener('click', () => {
        const dark = root.classList.toggle('dark');
        localStorage.setItem('afk-demo-theme', dark ? 'dark' : 'light');
      });
      document.getElementById('theme-attr').addEventListener('change', (e) => {
        game.setAttribute('theme', e.target.value);
      });
      const debug = document.getElementById('debug');
      debug.checked = new URLSearchParams(location.search).has('afkdebug');
      debug.addEventListener('change', () => game.toggleAttribute('debug', debug.checked));
      document.getElementById('clear-save').addEventListener('click', () => {
        localStorage.removeItem('afk-game');
        location.reload();
      });

      // Show the changelog times in the viewer's local time zone ("2026-11-10 23:05").
      // Without JavaScript they stay in UTC.
      for (const t of document.querySelectorAll('.staging-changelog time[datetime]')) {
        const d = new Date(t.getAttribute('datetime'));
        if (Number.isNaN(d.getTime())) continue;
        const p = (n) => String(n).padStart(2, '0');
        t.textContent = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
        t.title = d.toString();
      }

      // `AfkGame` is the global from the built bundle; the dev server loads the TS source instead.
      // Deferred scripts have run by DOMContentLoaded.
      addEventListener('DOMContentLoaded', () => {
        document.getElementById('version').textContent = window.AfkGame?.version ?? 'dev';
      });
    </script>
  </body>
</html>
